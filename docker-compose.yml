version: "3.8"

services:
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/Users/carlosjcasoc/Downloads/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - "--config.file=/Users/carlosjcasoc/Downloads/prometheus.yml"
    restart: unless-stopped

  grafana:
    image: grafana/grafana-enterprise:latest
    container_name: grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin # Cambia esta contraseña si lo deseas
    volumes:
      - grafana_data:/var/lib/grafana
    restart: unless-stopped
  
#  prometheus-kafka-adapter:
#    image: telefonica/prometheus-kafka-adapter:1.9.1
#    ports:
#      - "9093:9093"  # Mapea el puerto host al puerto del contenedor
#    environment:
#      PORT: "9093"   # El adaptador escuchará en este puerto
#      KAFKA_BROKER_LIST: "kafka:9092"
#      KAFKA_TOPIC: "metricas-prometheus"
  
  kafka:
    image: apache/kafka:4.1.0
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    volumes:
      - kafka_data:/var/lib/kafka/data

volumes:
  prometheus_data:
  grafana_data:
  kafka_data:
