spring.application.name=monitored-service
server.port=8080

# --- Actuator: exponer endpoints de monitorización ---
management.endpoints.web.exposure.include=health,info,prometheus,metrics
management.endpoint.health.show-details=always
management.endpoint.prometheus.enabled=true
management.endpoint.metrics.enabled=true

# --- Tags globales para filtrar en Grafana ---
management.metrics.tags.application=${spring.application.name}
management.metrics.tags.environment=local

# --- Histogramas para percentiles reales (P50/P95/P99) ---
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99
